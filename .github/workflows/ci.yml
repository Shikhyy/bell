name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install pinned dependencies
        run: cd contracts && ./install.sh
      - name: Test
        run: cd contracts && forge test

  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm --dir terminal install --frozen-lockfile
      - name: Build
        run: pnpm --dir terminal build
      - run: pnpm --dir cli install --frozen-lockfile
      - name: Typecheck the CLI
        run: pnpm --dir cli typecheck
